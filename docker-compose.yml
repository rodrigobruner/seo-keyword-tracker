services:
  db:
    image: postgres:16
    container_name: seo-tracker-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: seo_tracker
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d seo_tracker']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
