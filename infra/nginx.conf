# Serves the built SPA and proxies the API, so the browser talks to one origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: serve the file if it exists, otherwise hand routing to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API: /api/* -> api service, stripping the /api prefix (the API serves
  # /auth, /pages, /clients with no prefix). The trailing slash on proxy_pass
  # is what drops the matched /api/ segment.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
